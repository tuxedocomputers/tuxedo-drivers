# SPDX-License-Identifier: GPL-2.0+
include:
  - project: "tuxedocomputers/development/installation-testing/package-build-gitlab-ci-yaml"
    ref: "staging"
    file: "includes/multi-distro/template.yml"
    inputs:
      docker_size: "tiny"
      server_user: "deploy-deb-fixes"
      deploy_base_dir: "deb/tuxedo-fixes"
      test_mode: "tag"
      test_issue_project_path: "tuxedocomputers/development/packages/tuxedo-drivers"
      release_tag_ignore_pattern: "rc"
      test_distros:
        - alpm-archlinux
        - deb-ubuntu-noble
        - deb-ubuntu-resolute
        - deb-debian-trixie
        - deb-debian-testing
        - rpm-fedora-43
        - rpm-fedora-44
        - rpm-fedora-45
        - suse_rpm-opensuse-leap
